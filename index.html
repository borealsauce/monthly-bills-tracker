<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Monthly Bills Tracker</title><style>body{margin:0;background:#0f1115;color:#e6e8ee;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px}
input,button{font-size:18px;padding:12px 16px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#fff}button{background:#3b82f6;border:0;cursor:pointer}
#err{color:#f87171;min-height:1em}#app{display:none;max-width:1100px;margin:auto;padding:24px 16px}h1{margin:0 0 8px}h2{color:#9aa3b2;font-size:15px;text-transform:uppercase;letter-spacing:1px;margin:28px 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}a.c{display:block;padding:22px;border-radius:14px;background:#171a21;border:1px solid #262a33;color:inherit;text-decoration:none;transition:.15s}
a.c:hover{border-color:#3b82f6;transform:translateY(-2px)}a.c b{font-size:19px;display:block;margin-bottom:6px}a.c span{color:#9aa3b2;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px}th,td{padding:10px;border-bottom:1px solid #262a33;text-align:left}th{color:#9aa3b2;cursor:pointer;position:sticky;top:0;background:#0f1115}td.n{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700;font-size:17px}.big{font-size:40px;font-weight:700}.sub{color:#9aa3b2}.wrap{overflow-x:auto}</style></head><body>
<div id="gate"><h1>Monthly Bills Tracker</h1><input id="pw" type="password" inputmode="numeric" placeholder="Password" autofocus><button onclick="go()">Unlock</button><div id="err"></div></div>
<div id="app"><h1>Monthly Bills Tracker</h1><div class="sub">Typical monthly recurring bills · updated <span id="gen"></span></div><div style="margin-top:16px"><span class="sub">Total / month</span><div class="big" id="tot"></div><span class="sub" id="yr"></span></div><div class="wrap"><table id="t"></table></div></div>
<script>
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){try{const j=await (await fetch('data.enc.json',{cache:'no-store'})).json();const pw=document.getElementById('pw').value;
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(j.salt),iterations:j.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(j.iv)},k,b(j.ct))));
sessionStorage.billpw=pw;render(d)}catch(e){document.getElementById('err').textContent='Wrong password'}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(d){gate.style.display='none';app.style.display='block';gen.textContent=d.gen;tot.textContent=$(d.total);yr.textContent=$(d.total*12)+' / year';
t.innerHTML='<thead><tr>'+d.h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+r.map((c,i)=>i==1?`<td class="n" data-v="${c}">${$(c)}</td>`:i==4?`<td class="n">${c}</td>`:`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+`</tbody><tfoot><tr><td>TOTAL</td><td class="n" data-v="${d.total}">${$(d.total)}</td><td colspan="6"></td></tr></tfoot>`}
pw.addEventListener('keydown',e=>e.key==='Enter'&&go());
if(sessionStorage.billpw){pw.value=sessionStorage.billpw;go()}
</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();

</script><!--SORTABLE-END-->
</body></html>
