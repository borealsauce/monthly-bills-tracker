<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Monthly Bills Tracker</title>
<style>body{margin:0;background:#0f1115;color:#e6e8ee;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1150px;margin:auto;padding:28px 16px}h1{margin:0;font-size:28px}.sub{color:#8b93a3;font-size:14px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:24px 0}
.card{background:#171a21;border:1px solid #262a33;border-radius:16px;padding:20px}.card .l{color:#8b93a3;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.card .v{font-size:30px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}.card .s{color:#8b93a3;font-size:13px;margin-top:4px}
.card.hero{background:linear-gradient(135deg,#0f3d2e,#14532d);border-color:#22c55e}.card.hero .v{color:#4ade80;font-size:44px}
.tw{background:#171a21;border:1px solid #262a33;border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 14px;text-align:left;white-space:nowrap}
th{color:#8b93a3;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #262a33;cursor:pointer}
tbody tr:nth-child(even){background:#14171d}tbody tr:hover{background:#1d2230}td.n{text-align:right;font-variant-numeric:tabular-nums}
td.m{color:#4ade80;font-weight:600}tfoot td{font-weight:700;font-size:16px;border-top:2px solid #22c55e;color:#4ade80}
.pill{background:#232838;border-radius:999px;padding:3px 10px;font-size:12px;color:#c5cbe0}th{position:relative}.rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}.rz:after{content:'';position:absolute;right:3px;top:25%;bottom:25%;width:2px;border-radius:1px;background:#3a4152}.rz:hover:after,.rz.on:after{background:#22c55e}table.fx{table-layout:fixed;width:max-content}table.fx td,table.fx th{overflow:hidden;text-overflow:ellipsis}.pill.fi{background:#1e3a5f;color:#93c5fd}.pill.va{background:#4a3712;color:#fcd34d}</style></head><body><div class="w">
<h1>Monthly Bills Tracker</h1><div class="sub">Typical recurring monthly bills · updated <span id="gen"></span></div>
<div class="cards"><div class="card hero"><div class="l">Total / month</div><div class="v" id="tot">$0</div><div class="s">all recurring bills</div></div>
<div class="card"><div class="l">Total / year</div><div class="v" id="yr">$0</div><div class="s">monthly × 12</div></div>
<div class="card"><div class="l">Fixed vs Variable</div><div class="v" style="font-size:22px"><span id="fx" style="color:#60a5fa">$0</span> <span style="color:#8b93a3">/</span> <span id="vr" style="color:#fbbf24">$0</span></div><div class="s" id="fvp">fixed / variable per month</div></div>
<div class="card"><div class="l">Bills</div><div class="v" id="cnt">0</div><div class="s">recurring lines</div></div>
<div class="card"><div class="l">Largest category</div><div class="v" id="topc" style="font-size:22px"></div><div class="s" id="topv"></div></div></div>
<div class="tw"><table id="t"></table></div></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(v,d=2)=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function up(el,to,f,ms=1400){const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(s)})(t0)}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{gen.textContent=d.gen;
up(tot,d.total,v=>$(v));up(yr,d.total*12,v=>$(v,0));up(fx,d.fixed,v=>$(v,0));up(vr,d.var,v=>$(v,0));up(cnt,d.rows.length,v=>Math.round(v));
const c={};d.rows.forEach(r=>{const k=(r[2]||'Other').split(/ [–-] /)[0];c[k]=(c[k]||0)+r[3]});const tc=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];topc.textContent=tc[0];topv.textContent=$(tc[1])+' / month';
t.innerHTML='<thead><tr>'+d.h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+r.map((c,i)=>i==3?`<td class="n m" data-v="${c}">${$(c)}</td>`:i==6?`<td class="n">${c}</td>`:(i==2||i==1)&&c?`<td><span class="pill${c=='Variable'?' va':c=='Fixed'?' fi':''}">${esc(c)}</span></td>`:`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+`</tbody><tfoot><tr><td>TOTAL</td><td></td><td></td><td class="n" data-v="${d.total}">${$(d.total)}</td><td colspan="5"></td></tr></tfoot>`;rz()});

function rz(){const K='mbt_colw2',W=JSON.parse(localStorage[K]||'{}'),ths=[...t.querySelectorAll('thead th')];
ths.forEach((th,i)=>{if(!W[i])W[i]=th.getBoundingClientRect().width});ths.forEach((th,i)=>th.style.width=W[i]+'px');t.classList.add('fx');
ths.forEach((th,i)=>{const h=document.createElement('span');h.className='rz';h.title='Drag to resize';th.appendChild(h);
h.addEventListener('click',e=>{e.stopPropagation();e.preventDefault()},true);
h.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();h.setPointerCapture(e.pointerId);h.classList.add('on');const x0=e.clientX,w0=th.getBoundingClientRect().width;
const mv=ev=>{W[i]=Math.max(50,w0+ev.clientX-x0);th.style.width=W[i]+'px'};
const upf=()=>{h.classList.remove('on');h.removeEventListener('pointermove',mv);localStorage[K]=JSON.stringify(W);setTimeout(()=>{},0)};
h.addEventListener('pointermove',mv);h.addEventListener('pointerup',upf,{once:true})})})}
</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();

</script><!--SORTABLE-END-->
</body></html>
